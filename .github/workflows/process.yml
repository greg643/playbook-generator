name: Process Playbook

on:
  repository_dispatch:
    types: [process-playbook]

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Detect job mode
        id: detect
        run: |
          MODE=$(python -c "import os,json,boto3; print(json.loads(boto3.client('s3',endpoint_url=os.environ['R2_ENDPOINT'],aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],region_name='auto').get_object(Bucket=os.environ['R2_BUCKET'],Key='jobs/'+os.environ['JOB_ID']+'/status.json')['Body'].read()).get('mode','pptx'))" || echo pptx)
          echo "Job mode: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          JOB_ID: ${{ github.event.client_payload.job_id }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install LibreOffice (PPTX jobs only)
        if: steps.detect.outputs.mode != 'images'
        run: sudo apt-get install -y libreoffice-impress

      - name: Process playbook
        run: python pipeline/process_job.py "${{ github.event.client_payload.job_id }}"
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
