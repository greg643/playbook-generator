name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Function syntax
        run: find dashboard/functions -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run API and frontend tests
        run: node --test tests/api/*.test.mjs tests/frontend/*.test.mjs tests/workflows/*.test.mjs

  email-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/email-sender
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/email-sender/package-lock.json
      - name: Install email Worker dependencies
        run: npm ci
      - name: Verify generated Worker types
        run: npm run types:check
      - name: Type-check email Worker
        run: npm run typecheck
      - name: Test email Worker
        run: npm test
      - name: Validate email Worker deployment
        run: npm run deploy:dry-run

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q pipeline tests/pipeline
      - name: Run pipeline tests
        run: python -m unittest discover -s tests/pipeline -v
