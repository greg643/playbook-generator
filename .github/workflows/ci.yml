name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Function syntax
        run: find dashboard/functions -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run API and frontend tests
        run: node --test tests/api/*.test.mjs tests/frontend/*.test.mjs tests/workflows/*.test.mjs

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q pipeline tests/pipeline
      - name: Run pipeline tests
        run: python -m unittest discover -s tests/pipeline -v
