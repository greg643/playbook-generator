name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths: ['dashboard/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=playbook-generator --branch=main --commit-dirty=true
          workingDirectory: dashboard

      - name: Delete temporary owner-recovery deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Cloudflare account IDs are public identifiers. The repository had
          # no CLOUDFLARE_ACCOUNT_ID secret, so use the project's known ID.
          CLOUDFLARE_ACCOUNT_ID: 76317c04d814307dbb81c8fe71d287bb
          TEMPORARY_COMMITS: >-
            da1055d9a4a3649547a682e11a1b504d095543e0
            90fcdc2ba35270c99e6067b23ef8e95f9836cbbc
        run: |
          set -euo pipefail
          deployments="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/playbook-generator/deployments?env=production&per_page=100")"
          test "$(jq -r '.success' <<< "${deployments}")" = "true"

          for commit in ${TEMPORARY_COMMITS}; do
            deployment_ids="$(jq -r --arg commit "${commit}" \
              '.result[] | select([.. | strings] | index($commit)) | .id' \
              <<< "${deployments}")"
            if [ -z "${deployment_ids}" ]; then
              echo "Temporary deployment for ${commit} is already absent"
              continue
            fi

            while IFS= read -r deployment_id; do
              result="$(curl --fail-with-body --silent --show-error \
                --request DELETE \
                --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/playbook-generator/deployments/${deployment_id}?force=true")"
              test "$(jq -r '.success' <<< "${result}")" = "true"
            done <<< "${deployment_ids}"
          done
