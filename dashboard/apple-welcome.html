<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome — GSS Playbook Editor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font:18px/1.6 system-ui,sans-serif}
main{max-width:620px;margin:8vh auto;padding:2rem;background:#161b22;border:1px solid #30363d;border-radius:16px}
h1{font-size:2rem;line-height:1.2}a{color:#79c0ff}button{display:block;width:100%;padding:14px 18px;margin:16px 0;border:1px solid #484f58;border-radius:8px;background:#238636;color:white;font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}[hidden]{display:none!important}
@media(max-width:640px){main{margin:20px;padding:1.4rem}}
</style></head><body><main>
<a href="/">GSS Playbook Editor</a><h1>Welcome, coach.</h1>
<p id="intro">Checking your Apple sign-in…</p>
<button id="create" hidden>Create my playbook account</button>
<p id="status" role="status" aria-live="polite"></p>
<a id="restart" href="/api/auth/apple/start?returnTo=%2F" hidden>Continue with Apple again</a>
</main><script>
'use strict';
const $ = id => document.getElementById(id);
$('create').addEventListener('click', async () => {
  $('create').disabled = true;
  $('status').textContent = 'Creating your account…';
  try {
    const response = await fetch('/api/auth/apple/finish', {method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'new'})});
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Could not create your account.');
    location.replace(['/editor','/converter','/'].includes(data.returnTo) ? data.returnTo : '/');
  } catch (error) {
    $('status').textContent = error.message;
    $('restart').hidden = false;
  } finally { $('create').disabled = false; }
});
(async () => {
  try {
    const response = await fetch('/api/auth/apple/pending', {cache:'no-store'});
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Please continue with Apple again.');
    if (data.account) {
      location.replace('/');
      return;
    }
    $('intro').textContent = 'Your Apple sign-in is ready. Create a free account to start drawing plays and printing cards.';
    $('create').hidden = false;
  } catch (error) {
    $('intro').textContent = error.message;
    $('restart').hidden = false;
  }
})();
</script></body></html>
